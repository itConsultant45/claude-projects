<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Quick Tasks</h1>
    <p class="subtitle">A tiny to-do list. Saved in your browser.</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <ul id="task-list"></ul>

    <footer>
      <span id="task-count">0 tasks left</span>
      <button id="clear-done" class="link">Clear completed</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
